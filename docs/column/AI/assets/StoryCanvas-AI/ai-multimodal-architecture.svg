<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="blue-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="llm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="image-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="tts-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="video-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#500724"/>
    </linearGradient>
    <linearGradient id="out-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#a78bfa" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#34d399" />
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#f472b6" />
    </marker>
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="500" y="42" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold" letter-spacing="1">StoryCanvas AI 多模态混合调度架构全景图</text>
  <text x="500" y="64" text-anchor="middle" fill="#64748b" font-size="12" font-family="monospace">From Raw Story Text to Multimodal Video Synthesis Pipeline</text>

  <!-- ================= 1. INPUT LAYER ================= -->
  <g transform="translate(40, 95)">
    <rect width="200" height="200" rx="8" fill="url(#blue-card)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="200" height="32" rx="8" fill="#1d4ed8" fill-opacity="0.3"/>
    <text x="16" y="21" fill="#93c5fd" font-size="12" font-weight="bold">① 创作者输入层 (Input)</text>
    
    <g transform="translate(14, 45)">
      <rect width="172" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="10" y="19" fill="#f8fafc" font-size="11">📝 原始剧本 / 灵感故事</text>
    </g>
    <g transform="translate(14, 83)">
      <rect width="172" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="10" y="19" fill="#f8fafc" font-size="11">🎨 视觉画风 (20+ 预设 Tag)</text>
    </g>
    <g transform="translate(14, 121)">
      <rect width="172" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="10" y="19" fill="#f8fafc" font-size="11">📐 画面比例 (9:16 / 16:9)</text>
    </g>
    <g transform="translate(14, 159)">
      <rect width="172" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="10" y="19" fill="#94a3b8" font-size="11">🖼️ (可选) 角色参考图</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M240, 195 L290, 195" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)" stroke-dasharray="4 4"/>

  <!-- ================= 2. AI DIRECTOR LAYER ================= -->
  <g transform="translate(295, 95)">
    <rect width="240" height="200" rx="8" fill="url(#llm-grad)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="240" height="32" rx="8" fill="#6d28d9" fill-opacity="0.4"/>
    <text x="16" y="21" fill="#c4b5fd" font-size="12" font-weight="bold">② AI 导演引擎 (LLM Engine)</text>
    
    <g transform="translate(14, 45)">
      <rect width="212" height="40" rx="4" fill="#1e1b4b" stroke="#4c1d95"/>
      <text x="10" y="18" fill="#e9d5ff" font-size="11" font-weight="bold">DeepSeek-V3 / GPT-4o</text>
      <text x="10" y="32" fill="#a78bfa" font-size="10">统一 OpenAI 协议适配网关</text>
    </g>
    <g transform="translate(14, 93)">
      <rect width="212" height="44" rx="4" fill="#1e1b4b" stroke="#4c1d95"/>
      <text x="10" y="18" fill="#e9d5ff" font-size="11" font-weight="bold">🎬 好莱坞 6 大视听语言法则</text>
      <text x="10" y="34" fill="#a78bfa" font-size="10">拒绝流水账 • 景别交替 • 动作连贯</text>
    </g>
    <g transform="translate(14, 145)">
      <rect width="212" height="44" rx="4" fill="#1e1b4b" stroke="#4c1d95"/>
      <text x="10" y="18" fill="#e9d5ff" font-size="11" font-weight="bold">🛡️ JSON Schema 强类型约束</text>
      <text x="10" y="34" fill="#a78bfa" font-size="10">Strict Mode + 服务端 Zod 校验</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M535, 195 L585, 195" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- ================= 3. STRUCTURED ENTITY LAYER ================= -->
  <g transform="translate(590, 85)">
    <rect width="370" height="220" rx="8" fill="url(#blue-card)" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="370" height="32" rx="8" fill="#0369a1" fill-opacity="0.3"/>
    <text x="16" y="21" fill="#7dd3fc" font-size="12" font-weight="bold">③ 结构化分镜与角色资产解构</text>
    
    <!-- Character Asset Subcard -->
    <g transform="translate(14, 42)">
      <rect width="342" height="66" rx="4" fill="#0c4a6e" fill-opacity="0.4" stroke="#0284c7"/>
      <text x="10" y="18" fill="#38bdf8" font-size="11" font-weight="bold">👤 全局角色资产卡 (Character Entity)</text>
      <text x="10" y="36" fill="#e2e8f0" font-size="10">• 角色名称 &amp; 性格小传</text>
      <text x="10" y="54" fill="#bae6fd" font-size="10">• 锁定外观指南 (Locked Guide: 发色/瞳色/服装/配饰)</text>
    </g>

    <!-- Shot Sequence Subcard -->
    <g transform="translate(14, 116)">
      <rect width="342" height="90" rx="4" fill="#0c4a6e" fill-opacity="0.4" stroke="#0284c7"/>
      <text x="10" y="18" fill="#38bdf8" font-size="11" font-weight="bold">🎞️ 连续分镜序列 (Shot Nodes #01 ~ #0N)</text>
      <text x="10" y="36" fill="#e2e8f0" font-size="10">• 画面描述 (Prompt) &amp; 景别 (Wide / Medium / Close-up)</text>
      <text x="10" y="54" fill="#e2e8f0" font-size="10">• 机位运镜 (Zoom-in / Pan-left) &amp; 预设时长 (2-8s)</text>
      <text x="10" y="72" fill="#e2e8f0" font-size="10">• 角色对白台词 (Dialogue) &amp; 底部字幕 (Subtitle)</text>
    </g>
  </g>

  <!-- Connecting Trunk Line down to Dispatching -->
  <path d="M775, 305 L775, 335 L500, 335 L500, 360" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- Section Label -->
  <rect x="390" y="323" width="220" height="24" rx="12" fill="#0f172a" stroke="#38bdf8"/>
  <text x="500" y="339" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">④ 多模态异步并行调度网关</text>

  <!-- Branching Lines from 500,360 to 3 branches -->
  <path d="M500, 360 L180, 360 L180, 385" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M500, 360 L500, 385" stroke="#fbbf24" stroke-width="2" fill="none" marker-end="url(#arrow-amber)"/>
  <path d="M500, 360 L820, 360 L820, 385" stroke="#f472b6" stroke-width="2" fill="none" marker-end="url(#arrow-pink)"/>

  <!-- ================= 4. MULTIMODAL WORKERS ================= -->
  <!-- Branch A: Text to Image -->
  <g transform="translate(50, 390)">
    <rect width="260" height="135" rx="8" fill="url(#image-grad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="260" height="28" rx="8" fill="#047857" fill-opacity="0.5"/>
    <text x="12" y="19" fill="#a7f3d0" font-size="11" font-weight="bold">🎨 图像生成 (Text-to-Image)</text>
    
    <text x="14" y="48" fill="#ffffff" font-size="11" font-weight="bold">Kwai-Kolors / DALL-E 3</text>
    <text x="14" y="68" fill="#6ee7b7" font-size="10">• 链式注入 Character Guide</text>
    <text x="14" y="86" fill="#6ee7b7" font-size="10">• 负向过滤词 (去气泡/去水印/去拼贴)</text>
    <text x="14" y="104" fill="#6ee7b7" font-size="10">• 自动绘制 1:1 头像与 16:9 分镜图</text>
    <rect x="14" y="112" width="232" height="16" rx="3" fill="#065f46"/>
    <text x="130" y="124" text-anchor="middle" fill="#d1fae5" font-size="9" font-weight="bold">输出: 高清分镜关键帧 PNG/JPG</text>
  </g>

  <!-- Branch B: Text to Speech -->
  <g transform="translate(370, 390)">
    <rect width="260" height="135" rx="8" fill="url(#tts-grad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="260" height="28" rx="8" fill="#b45309" fill-opacity="0.5"/>
    <text x="12" y="19" fill="#fde68a" font-size="11" font-weight="bold">🎙️ 语音合成 (Text-to-Speech)</text>
    
    <text x="14" y="48" fill="#ffffff" font-size="11" font-weight="bold">Fish-Speech 1.5 / OpenAI TTS</text>
    <text x="14" y="68" fill="#fcd34d" font-size="10">• 对白情绪起伏分析 (Alex 音色)</text>
    <text x="14" y="86" fill="#fcd34d" font-size="10">• 毫秒级对白切片生成</text>
    <text x="14" y="104" fill="#fcd34d" font-size="10">• 自动音频降噪与波形预热</text>
    <rect x="14" y="112" width="232" height="16" rx="3" fill="#92400e"/>
    <text x="130" y="124" text-anchor="middle" fill="#fef3c7" font-size="9" font-weight="bold">输出: 单镜头对白音频 MP3</text>
  </g>

  <!-- Branch C: Image to Video -->
  <g transform="translate(690, 390)">
    <rect width="260" height="135" rx="8" fill="url(#video-grad)" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="260" height="28" rx="8" fill="#be185d" fill-opacity="0.5"/>
    <text x="12" y="19" fill="#fbcfe8" font-size="11" font-weight="bold">🎬 图生视频 (Image-to-Video)</text>
    
    <text x="14" y="48" fill="#ffffff" font-size="11" font-weight="bold">智谱 CogVideoX-3 (异步管线)</text>
    <text x="14" y="68" fill="#f472b6" font-size="10">• 静态关键帧动态化升级</text>
    <text x="14" y="86" fill="#f472b6" font-size="10">• 真实光影动态与运动幅度解析</text>
    <text x="14" y="104" fill="#f472b6" font-size="10">• 异步轮询任务状态 (Task Polling)</text>
    <rect x="14" y="112" width="232" height="16" rx="3" fill="#9d174d"/>
    <text x="130" y="124" text-anchor="middle" fill="#fdf2f8" font-size="9" font-weight="bold">输出: 4-5s 动态镜头片段 MP4</text>
  </g>

  <!-- ================= 5. CONVERGENCE TO LOCAL STUDIO ================= -->
  <!-- Convergence Lines -->
  <path d="M180, 525 L180, 555 L500, 555" stroke="#34d399" stroke-width="1.5" fill="none"/>
  <path d="M500, 525 L500, 555" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
  <path d="M820, 525 L820, 555 L500, 555" stroke="#f472b6" stroke-width="1.5" fill="none"/>
  <path d="M500, 555 L500, 575" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <g transform="translate(80, 580)">
    <rect width="840" height="80" rx="8" fill="url(#out-grad)" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="840" height="26" rx="8" fill="#4338ca" fill-opacity="0.4"/>
    <text x="16" y="18" fill="#c7d2fe" font-size="11" font-weight="bold">⑤ 本地资产沉淀、可视化工作台与 FFmpeg 原生渲染导出</text>

    <g transform="translate(16, 36)">
      <rect width="255" height="34" rx="4" fill="#1e1b4b" stroke="#4338ca"/>
      <text x="10" y="14" fill="#a5b4fc" font-size="10" font-weight="bold">📦 SQLite 本地优先存储 (Prisma)</text>
      <text x="10" y="28" fill="#cbd5e1" font-size="9">Project / Character / Shot / Edge 级联持久化</text>
    </g>

    <g transform="translate(285, 36)">
      <rect width="265" height="34" rx="4" fill="#1e1b4b" stroke="#4338ca"/>
      <text x="10" y="14" fill="#a5b4fc" font-size="10" font-weight="bold">🖥️ 双模工作台 &amp; 实时监视器</text>
      <text x="10" y="28" fill="#cbd5e1" font-size="9">VueFlow 节点画布 + V1/A1 时间轴 + CSS 运镜</text>
    </g>

    <g transform="translate(565, 36)">
      <rect width="260" height="34" rx="4" fill="#1e1b4b" stroke="#4338ca"/>
      <text x="10" y="14" fill="#a5b4fc" font-size="10" font-weight="bold">🎞️ 本地 FFmpeg 原生混流引擎</text>
      <text x="10" y="28" fill="#cbd5e1" font-size="9">Sharp 字幕 + ZoomPan 运镜 + BGM 混流 -> MP4</text>
    </g>
  </g>

</svg>